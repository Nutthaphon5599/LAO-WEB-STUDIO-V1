<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Website Admin — Lao Web Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
<header class="admin-header"><a class="brand" href="index.html"><img src="assets/logo.png" alt=""><span>LAO WEB STUDIO</span></a><a class="btn btn-secondary" href="index.html#portfolio">ເບິ່ງໜ້າເວັບ</a></header>
<main class="admin-main"><p id="global-status" class="save-status" aria-live="polite"></p><section id="login-card" class="pricing-admin-card" hidden><h2>Admin Login</h2><form id="login-form" class="pricing-admin-form"><label>Email<input id="login-email" type="email" required></label><label>Password<input id="login-password" type="password" required></label><button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button></form></section><div id="admin-app" hidden>
<section class="admin-intro"><span>WEBSITE ADMIN</span><h1>ຈັດການລາຄາ ແລະ ຜົນງານ</h1><p>ປ່ຽນລາຄາແພັກເກດໄດ້ທຸກເວລາ ແລະ ເພີ່ມໄດ້ສູງສຸດ 6 ຜົນງານ.</p><div class="notice"><b>ໝາຍເຫດ:</b> ຂໍ້ມູນຈະບັນທຶກໃນ Supabase ແລະ ອັບເດດໃຫ້ຜູ້ເຂົ້າຊົມທຸກຄົນເຫັນ.</div></section>

<section class="pricing-admin-card">
  <div class="admin-list-head"><div><span class="mini-label">PRICING</span><h2>ຈັດການລາຄາແພັກເກດ</h2></div></div>
  <form id="pricing-form" class="pricing-admin-form">
    <label>Starter<input id="price-starter" inputmode="numeric" placeholder="200.000" required></label>
    <label>Business<input id="price-business" inputmode="numeric" placeholder="500.000" required></label>
    <label>Premium<input id="price-premium" inputmode="numeric" placeholder="800.000" required></label>
    <label>ສະກຸນເງິນ<input id="price-currency" value="ກີບ" required></label>
    <button class="btn btn-primary" type="submit">ບັນທຶກລາຄາ</button>
  </form>
  <p class="save-status" id="pricing-status" aria-live="polite"></p>
</section>
<section class="admin-layout">
<form id="project-form" class="admin-form">
  <input type="hidden" id="edit-id">
  <h2 id="form-title">ເພີ່ມຜົນງານ</h2>
  <div class="field-grid"><label>ປະເພດ (ລາວ)<input id="category-lo" required></label><label>ประเภท (ไทย)<input id="category-th" required></label><label>Category (English)<input id="category-en" required></label></div>
  <div class="field-grid"><label>ຊື່ຜົນງານ (ລາວ)<input id="name-lo" required></label><label>ชื่อผลงาน (ไทย)<input id="name-th" required></label><label>Project name (English)<input id="name-en" required></label></div>
  <div class="field-grid"><label>ລາຍລະອຽດ (ລາວ)<textarea id="desc-lo" rows="4" required></textarea></label><label>รายละเอียด (ไทย)<textarea id="desc-th" rows="4" required></textarea></label><label>Description (English)<textarea id="desc-en" rows="4" required></textarea></label></div>
  <label>Website URL<input id="project-url" type="url" placeholder="https://..." required></label>
  <label>ຮູບໜ້າປົກ<input id="project-image" type="file" accept="image/*"><small>ແນະນຳຮູບແນວນອນ 1600 × 900 px. ຖ້າແກ້ໄຂ ແລະ ບໍ່ເລືອກຮູບໃໝ່ ຈະໃຊ້ຮູບເກົ່າ.</small></label>
  <div class="form-actions"><button class="btn btn-primary" type="submit">ບັນທຶກຜົນງານ</button><button class="btn btn-secondary" type="button" id="cancel-edit" hidden>ຍົກເລີກ</button></div>
</form>
<div><div class="admin-list-head"><h2>ຜົນງານປັດຈຸບັນ <span id="count"></span></h2></div><div id="project-list" class="admin-list"></div></div>
</section>
<button id="logout" class="text-btn danger" type="button">ออกจากระบบ</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="projects.js"></script><script src="pricing.js"></script><script src="admin.js"></script>
</body></html>
